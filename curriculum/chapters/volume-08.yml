    level: L1
    status: drafting
    stable_core: false
    topic_groups:
      - id: js-runtime-hosts
        title: "运行时与宿主"
        topics: ["js.ecmascript-host-boundary", "js.browser-runtime", "js.node-runtime", "js.console-output"]
      - id: js-package-esm
        title: "包管理与 ESM"
        topics: ["js.package-json", "js.pnpm-workflow", "js.esm-import-export", "js.module-resolution"]
