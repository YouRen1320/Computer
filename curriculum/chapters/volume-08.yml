    prerequisites: ["ch.foundations.dependencies-build-packages"]
    prerequisite_rationales:
      ch.foundations.dependencies-build-packages:
        reason: "package、依赖、锁文件和构建生命周期复用通用依赖与可重复构建模型。"
        capabilities: []
        topics: []
        outcome_ids: [explain, build, diagnose]
    capabilities:
      teaches: []
      uses: ["foundation.toolchain-env-build"]
    borrowed_scaffolds: []
    lab_requirements:
      required: true
      artifact_paths:
        - labs/encyclopedia/ch.js.runtime-esm/
      acceptance:
        - "从空目录创建可重复安装和运行的 ESM 小项目；命令、输入、环境与结果可从空目录复现；验收判据：从空目录安装锁定依赖并运行两个 ESM 模块，实际 node/pnpm 路径、版本、输出和退出码与记录一致。"
        - "注入“Node/pnpm 解析到错误版本、包类型错误或模块路径错误”后能指出首个可信证据，修复并重跑同一验证；修复后判据：从空目录安装锁定依赖并运行两个 ESM 模块，实际 node/pnpm 路径、版本、输出和退出码与记录一致。"
    gate_requirements:
      gate_ids: ["G4"]
      evidence_paths: ["evidence/gates/g4/ch.js.runtime-esm/"]
      critical_failure_modes: ["toolchain-version-drift", "module-resolution-failure"]
    verification_mode:
      test_level: T0
      methods: ["version-evidence", "module-run", "exit-code"]
      oracle: "从空目录安装锁定依赖并运行两个 ESM 模块，实际 node/pnpm 路径、版本、输出和退出码与记录一致。"
    version_surfaces: ["node-24-lts", "pnpm"]
    outcomes:
      - id: explain
        kind: concept
        text: "在 120 秒内解释“JavaScript 运行时、Node、pnpm 与 ESM”的职责、边界与证据，并给出一个不应由本章方案解决的反例"
        covers_topic_groups: ["js-runtime-hosts", "js-package-esm"]
        covers_topics: ["js.ecmascript-host-boundary", "js.browser-runtime", "js.node-runtime", "js.console-output", "js.package-json", "js.pnpm-workflow", "js.esm-import-export", "js.module-resolution"]
        uses_capabilities: ["foundation.toolchain-env-build"]
        evidence_kind: timed-teach-back
        verification_mode: oral-explanation
      - id: build
        kind: independent-build
        text: "从空目录创建可重复安装和运行的 ESM 小项目；不复制成品，保存可复现输入、工件与验证结果"
        covers_topic_groups: ["js-runtime-hosts", "js-package-esm"]
        covers_topics: ["js.ecmascript-host-boundary", "js.browser-runtime", "js.node-runtime", "js.console-output", "js.package-json", "js.pnpm-workflow", "js.esm-import-export", "js.module-resolution"]
        uses_capabilities: ["foundation.toolchain-env-build"]
        evidence_kind: runnable-artifact-and-oracle
        verification_mode: "version-evidence-module-run-exit-code"
      - id: diagnose
        kind: fault-diagnosis
        text: "面对“Node/pnpm 解析到错误版本、包类型错误或模块路径错误”，定位失败阶段和首个可信证据，修复后重跑原验证并说明残余风险"
        covers_topic_groups: ["js-runtime-hosts", "js-package-esm"]
        covers_topics: ["js.ecmascript-host-boundary", "js.browser-runtime", "js.node-runtime", "js.console-output", "js.package-json", "js.pnpm-workflow", "js.esm-import-export", "js.module-resolution"]
        uses_capabilities: ["foundation.toolchain-env-build"]
        evidence_kind: failure-log-fix-rerun
        verification_mode: injected-fault-rerun
