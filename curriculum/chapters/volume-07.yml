  - id: ch.web.browser-render-devtools
    title: "浏览器请求、解析、渲染与 DevTools 观察"
    role: foundation
    responsibility: "建立从导航请求到 DOM/CSSOM、布局、绘制和合成的可观察浏览器管线，只做测量与解释，不在本章优化 JavaScript 性能。"
    level: L1
    status: planned
    stable_core: true
    topic_groups:
      - id: web-browser-pipeline
        title: "浏览器加载与渲染管线"
        topics: ["web.navigation-request","web.html-parsing-dom","web.cssom-render-tree","web.layout-paint-composite"]
      - id: web-devtools-observation
        title: "DevTools 证据"
        topics: ["web.devtools-network-panel", "web.devtools-elements-panel", "web.devtools-performance-baseline"]
    topics_taught: ["web.navigation-request","web.html-parsing-dom","web.cssom-render-tree","web.layout-paint-composite","web.devtools-network-panel","web.devtools-elements-panel","web.devtools-performance-baseline"]
    topics_used: ["web.navigation-request","web.html-parsing-dom","web.cssom-render-tree","web.layout-paint-composite","web.devtools-network-panel","web.devtools-elements-panel","web.devtools-performance-baseline"]
    prerequisites: ["ch.foundations.http-curl"]
    prerequisite_rationales:
      ch.foundations.http-curl:
        reason: "浏览器网络面板中的方法、状态码、Header 与 Body 必须先能用 HTTP 报文和 curl 独立验证。"
        capabilities: []
        topics: []
        outcome_ids: [explain, build, diagnose]
    capabilities:
      teaches: ["web.browser-rendering"]
      uses: ["foundation.http-message"]
    borrowed_scaffolds: []
    lab_requirements:
      required: true
      artifact_paths:
        - labs/encyclopedia/ch.web.browser-render-devtools/
      acceptance:
        - "制作一个最小页面并保存请求、解析和渲染阶段的 DevTools 证据；命令、输入、环境与结果可从空目录复现；验收判据：同一测试页面的请求瀑布、DOM 结构和渲染阶段能由保存的 HAR、截图与时间线重复核对。；通过条件：关键断言与预期输出全部通过。"
        - "注入“错误资源路径或阻塞资源导致的加载与渲染异常”后能指出首个可信证据，修复并重跑同一验证；修复后判据：同一测试页面的请求瀑布、DOM 结构和渲染阶段能由保存的 HAR、截图与时间线重复核对。；通过条件：关键断言与预期输出全部通过。"
    gate_requirements:
      gate_ids: ["G4"]
      evidence_paths: ["evidence/gates/g4/ch.web.browser-render-devtools/"]
      critical_failure_modes: ["network-evidence-mismatch", "render-pipeline-misdiagnosis"]
    verification_mode:
      test_level: T0
      methods: ["prediction", "devtools-observation", "command-exit"]
      oracle: "同一测试页面的请求瀑布、DOM 结构和渲染阶段能由保存的 HAR、截图与时间线重复核对。"
    version_surfaces: ["browser", "browser-devtools", "html-living-standard", "css"]
    outcomes:
      - id: explain
        kind: concept
        text: "在 120 秒内解释“浏览器请求、解析、渲染与 DevTools 观察”的职责、边界与证据，并给出一个不应由本章方案解决的反例"
        covers_topic_groups: ["web-browser-pipeline", "web-devtools-observation"]
        covers_topics: ["web.navigation-request","web.html-parsing-dom","web.cssom-render-tree","web.layout-paint-composite","web.devtools-network-panel","web.devtools-elements-panel","web.devtools-performance-baseline"]
        uses_capabilities: ["foundation.http-message", "web.browser-rendering"]
        evidence_kind: timed-teach-back
        verification_mode: oral-explanation
      - id: build
