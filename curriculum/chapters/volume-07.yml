        text: "围绕“浏览器请求、解析、渲染与 DevTools 观察”构建可运行程序与测试：制作一个最小页面并保存请求、解析和渲染阶段的 DevTools 证据；不复制成品，保存可复现输入、工件与验证结果"
        covers_topic_groups: ["web-browser-pipeline", "web-devtools-observation"]
        covers_topics: ["web.navigation-request","web.html-parsing-dom","web.cssom-render-tree","web.layout-paint-composite","web.devtools-network-panel","web.devtools-elements-panel","web.devtools-performance-baseline"]
        uses_capabilities: ["foundation.http-message", "web.browser-rendering"]
        evidence_kind: runnable-artifact-and-oracle
        verification_mode: "prediction-devtools-observation-command-exit"
      - id: diagnose
        kind: fault-diagnosis
        text: "面对“错误资源路径或阻塞资源导致的加载与渲染异常”，定位失败阶段和首个可信证据，修复后重跑原验证并说明残余风险"
        covers_topic_groups: ["web-browser-pipeline", "web-devtools-observation"]
        covers_topics: ["web.navigation-request","web.html-parsing-dom","web.cssom-render-tree","web.layout-paint-composite","web.devtools-network-panel","web.devtools-elements-panel","web.devtools-performance-baseline"]
