    verification_mode:
      test_level: T1
      methods: ["prediction", "request-matrix", "header-assertions"]
      oracle: "固定的同源/跨源请求矩阵应得到确定的 Cookie、CORS 与缓存命中结果，并可由响应头和浏览器控制台复核。"
