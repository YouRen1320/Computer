  - id: ch.web.origin-cookie-cache
    title: "Origin、同源、Cookie、缓存与 CORS 浏览器模型"
    role: concept
    responsibility: "解释浏览器如何按 Origin 隔离读取、携带 Cookie 并复用缓存，区分浏览器 CORS 执行与服务端授权，不进入登录业务实现。"
    level: L1
    status: planned
    stable_core: true
    topic_groups:
      - id: web-origin-browser-security
        title: "Origin 与浏览器隔离"
        topics: ["web.origin-tuple","web.same-origin-policy","web.cors-browser-enforcement","web.cookie-attachment"]
      - id: web-browser-cache-model
        title: "缓存与渲染输入"
        topics: ["web.http-cache-browser", "web.cache-validation", "web.navigation-cache-effect", "web.layout-paint-composite"]
    topics_taught: ["web.origin-tuple","web.same-origin-policy","web.cors-browser-enforcement","web.cookie-attachment","web.http-cache-browser","web.cache-validation","web.navigation-cache-effect"]
    topics_used: ["web.origin-tuple","web.same-origin-policy","web.cors-browser-enforcement","web.cookie-attachment","web.http-cache-browser","web.cache-validation","web.navigation-cache-effect","web.layout-paint-composite"]
    prerequisites: ["ch.web.browser-render-devtools"]
    prerequisite_rationales:
      ch.web.browser-render-devtools:
        reason: "Origin、Cookie 与缓存行为需要在已理解的导航和渲染管线中观察，避免把浏览器策略误当成服务器故障。"
        capabilities: []
        topics: []
        outcome_ids: [explain, build, diagnose]
    capabilities:
      teaches: ["web.browser-origin-state"]
      uses: ["web.browser-rendering", "foundation.http-message"]
    borrowed_scaffolds: []
    lab_requirements:
      required: true
      artifact_paths:
        - labs/encyclopedia/ch.web.origin-cookie-cache/
      acceptance:
        - "搭建两个 Origin 的最小请求矩阵并记录 Cookie、CORS 与缓存结果；命令、输入、环境与结果可从空目录复现；验收判据：固定的同源/跨源请求矩阵应得到确定的 Cookie、CORS 与缓存命中结果，并可由响应头和浏览器控制台复核。；通过条件：关键断言与预期输出全部通过。"
        - "注入“错误的 Origin、SameSite 或缓存头引起的请求阻断与陈旧响应”后能指出首个可信证据，修复并重跑同一验证；修复后判据：固定的同源/跨源请求矩阵应得到确定的 Cookie、CORS 与缓存命中结果，并可由响应头和浏览器控制台复核。；通过条件：关键断言与预期输出全部通过。"
