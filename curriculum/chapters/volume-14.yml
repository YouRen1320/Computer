      - id: llm-api-contract
        title: "模型 API 合同"
        topics: ["llm.api-authentication","llm.message-roles","llm.model-parameter","llm.provider-error"]
      - id: llm-prompt-cost
        title: "提示与成本"
        topics: ["llm.prompt-version","llm.token-usage","llm.cost-estimation","llm.latency-budget"]
    topics_taught: ["llm.api-authentication","llm.message-roles","llm.model-parameter","llm.provider-error","llm.prompt-version","llm.token-usage","llm.cost-estimation","llm.latency-budget"]
    topics_used: ["llm.api-authentication","llm.message-roles","llm.model-parameter","llm.provider-error","llm.prompt-version","llm.token-usage","llm.cost-estimation","llm.latency-budget"]
