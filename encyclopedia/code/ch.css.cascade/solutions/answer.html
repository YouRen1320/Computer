<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS 层叠练习参考</title>
  <link rel="stylesheet" href="./answer.css">
</head>
<body>
  <!-- Responsibility: 提供私有参考答案的固定语义目标。 -->
  <!-- Data source: answer.json 的已纠正判断与静态教学状态。 -->
  <!-- Mapping: class/data-state 映射样式候选，状态文字仍直接可见。 -->
  <!-- Side effects: 只加载本地 CSS，不执行脚本或业务写操作。 -->
  <main id="exercise">
    <article class="incident is-critical" data-state="open">
      <h1 class="title">压力异常</h1>
      <p class="summary">请诊断层叠与继承。</p>
      <p class="code">EX-CASCADE</p>
    </article>
  </main>
</body>
</html>
