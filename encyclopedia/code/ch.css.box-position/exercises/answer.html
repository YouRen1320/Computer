<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盒模型与定位练习</title>
  <link rel="stylesheet" href="./answer.css">
</head>
<body>
  <!-- Responsibility: 提供公开练习的固定盒、定位与遮挡目标。 -->
  <!-- Data source: answer.json 的教学手算，不读取真实业务数据。 -->
  <!-- Mapping: class 对应 oracle 检查的 box/containing block/stacking/overflow 契约。 -->
  <!-- Side effects: 只加载本地 CSS，不执行脚本或写入外部状态。 -->
  <main>
    <h1>盒模型与定位练习</h1>
    <section class="normal-flow"><p>正常流 A</p><p>正常流 B</p></section>
    <section class="stage"><article class="card">300px card<span class="badge">badge</span></article></section>
    <section class="stack-stage"><div class="panel-a">A<span class="tooltip">tooltip</span></div><div class="panel-b">B</div></section>
    <div class="overflow-hidden">hidden content content content</div>
    <div class="overflow-clip">clip content content content</div>
  </main>
</body>
</html>
