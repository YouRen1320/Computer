<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid 练习参考</title>
  <link rel="stylesheet" href="./answer.css">
</head>
<body>
  <!-- Responsibility: 提供私有参考的二维区域与自动放置直接子项。 -->
  <!-- Data source: answer.json 的正确判断和静态长工单标识。 -->
  <!-- Mapping: DOM/areas 为 filters→orders/detail，自动项保持 sparse 源顺序。 -->
  <!-- Side effects: 只加载本地 CSS，不读取、排序或修改真实工单。 -->
  <main class="layout">
    <form class="filters">筛选</form>
    <section class="orders">VERY-LONG-WORK-ORDER-IDENTIFIER-0001</section>
    <aside class="detail">详情</aside>
  </main>
  <section class="auto-list"><article>A</article><article>B</article><article>C</article><article>D</article></section>
</body>
</html>
