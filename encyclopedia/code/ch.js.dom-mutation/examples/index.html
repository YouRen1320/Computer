<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>FactoryCare 工单队列 DOM 示例</title>
  </head>
  <body>
    <!-- Responsibility: 提供脚本已知的语义外壳，不处理事件、网络或业务授权。 -->
    <!-- Data source: 工单数据由同目录 demo.mjs 的固定教学夹具提供。 -->
    <!-- Mapping: main/section/ul 保持 landmark 与列表语义，脚本只创建 li 子项。 -->
    <!-- Side effects: 脚本只修改当前文档的列表、空态与工单文本/property。 -->
    <main>
      <h1>FactoryCare 工单队列</h1>
      <section aria-labelledby="queue-title">
        <h2 id="queue-title">待处理工单</h2>
        <p id="board-status" aria-live="polite" hidden></p>
        <ul id="work-order-list"></ul>
      </section>
    </main>
  </body>
</html>
