<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>工单 WO-EX-004｜语义练习</title>
    <meta name="description" content="语义 HTML 独立练习的修复后静态工单。">
    <link rel="canonical" href="https://docs.factorycare.example/work-orders/WO-EX-004">
  </head>
  <body>
    <!-- Responsibility: 呈现一份只读教学工单并保持无样式也可理解。 -->
    <!-- Data source: 固定 exercise-fixture-v1，不读取真实 FactoryCare 数据。 -->
    <!-- Mapping: 概要映射到 dl，转换事件按发生顺序映射到 ol。 -->
    <!-- Side effects: 静态页无脚本、表单或网络写入。 -->
    <header>
      <p><strong>FactoryCare 语义练习</strong></p>
      <nav>
        <p>本页目录</p>
        <ul>
          <li><a href="#summary">故障摘要</a></li>
          <li><a href="#timeline">流转记录</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <article>
        <h1>工单 WO-EX-004</h1>
        <section id="summary">
          <h2>故障摘要</h2>
          <dl>
            <dt>状态</dt><dd>已创建</dd>
            <dt>创建时间</dt><dd><time datetime="2026-07-17T11:00:00+08:00">11:00</time></dd>
          </dl>
        </section>
        <section id="timeline">
          <h2>流转记录</h2>
          <ol>
            <li><h3>已创建</h3><p>固定教学工单已进入队列。</p></li>
          </ol>
        </section>
        <footer><p>无真实用户数据。</p></footer>
      </article>
    </main>
    <footer><p><small>FactoryCare 学习项目</small></p></footer>
  </body>
</html>
