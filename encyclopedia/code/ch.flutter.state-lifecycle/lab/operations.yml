initial_mounted: true
events:
  - type: start
    operation: A
    filter: ASSIGNED
  - type: start
    operation: B
    filter: IN_PROGRESS
  - type: complete
    operation: B
    result: [WO-B]
  - type: complete
    operation: A
    result: [WO-A]
  - type: dispose
oracle:
  visible_items: [WO-B]
  committed_operations: [B]
  ignored_operations: [A]
list_identity:
  before:
    - key: WO-A
      local_state: expanded
    - key: WO-B
      local_state: collapsed
  reordered_keys: [WO-B, WO-A]
  oracle:
    - key: WO-B
      local_state: collapsed
    - key: WO-A
      local_state: expanded
