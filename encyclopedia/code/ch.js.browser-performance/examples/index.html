<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work-order performance model</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!-- The accessible list is the real-browser target; Node verification uses the same four row identifiers. -->
    <main>
      <h1>Open work orders</h1>
      <ul class="work-order-list" aria-label="Open work orders">
        <li class="work-order-row" style="--row-offset: 0px"><button>Open WO-1</button></li>
        <li class="work-order-row" style="--row-offset: 40px"><button>Open WO-2</button></li>
        <li class="work-order-row" style="--row-offset: 80px"><button>Open WO-3</button></li>
        <li class="work-order-row" style="--row-offset: 120px"><button>Open WO-4</button></li>
      </ul>
    </main>
  </body>
</html>
