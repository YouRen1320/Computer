name: factorycare-ci-controlled-fixture
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111
      - run: ./mvnw -B test
      - if: always()
        uses: actions/upload-artifact@2222222222222222222222222222222222222222
  web-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - if: always()
        uses: actions/upload-artifact@2222222222222222222222222222222222222222
  python-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111
      - run: uv sync --locked
      - run: uv run pytest
      - if: always()
        uses: actions/upload-artifact@2222222222222222222222222222222222222222
  release-gate:
    needs: [java-test, web-test, python-test]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "all required jobs succeeded"
