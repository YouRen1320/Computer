    AttachmentPurpose:
      type: string
      enum: [REPORT_CREATION, REPORT_SUPPLEMENT, WORK_ORDER]
      description: Upload workflow intent; it is not the final business owner type.
    AttachmentBusinessOwnerType:
      type: string
      enum: [REPORT, WORK_ORDER]
      description: Final business aggregate that authorizes and owns an attachment after binding.
    CreateAttachmentUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [purpose, fileName, size, mime, sha256]
      properties:
        purpose:
          $ref: '#/components/schemas/AttachmentPurpose'
        ownerId:
          type: [string, 'null']
          format: uuid
          description: >-
            May be null only for REPORT_CREATION before a report exists. For
            REPORT_SUPPLEMENT this is a Report id; for WORK_ORDER it is a WorkOrder id.
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 52428800
        mime:
          type: string
          maxLength: 200
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
      allOf:
        - if:
            properties:
              purpose:
                enum: [REPORT_SUPPLEMENT, WORK_ORDER]
          then:
            required: [ownerId]
            properties:
              ownerId:
                type: string
                format: uuid
    AttachmentUploadIntent:
      type: object
      additionalProperties: false
      required: [attachmentId, intentId, method, uploadUrl, expiresAt, requiredHeaders]
      properties:
        attachmentId:
          type: string
          format: uuid
        intentId:
          type: string
          format: uuid
        method:
          const: PUT
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
    CompleteAttachmentUploadRequest:
      type: object
      additionalProperties: false
      required: [intentId, sha256]
      properties:
        intentId:
          type: string
          format: uuid
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    AttachmentMetadata:
      type: object
      additionalProperties: false
      required: [id, purpose, businessOwnerType, businessOwnerId, fileName, size, mime, sha256, status]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/AttachmentPurpose'
        businessOwnerType:
          oneOf:
            - $ref: '#/components/schemas/AttachmentBusinessOwnerType'
            - type: 'null'
          description: >-
            Null only while a REPORT_CREATION upload awaits atomic report binding;
            once bound, the final owner is REPORT or WORK_ORDER.
        businessOwnerId:
          type: [string, 'null']
          format: uuid
        fileName:
          type: string
        size:
          type: integer
          minimum: 1
        mime:
          type: string
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [PENDING_UPLOAD, SCANNING, AVAILABLE, QUARANTINED, REJECTED]
      allOf:
        - if:
            properties:
              purpose:
                const: REPORT_SUPPLEMENT
          then:
            properties:
              businessOwnerType:
                const: REPORT
              businessOwnerId:
                type: string
                format: uuid
        - if:
            properties:
              purpose:
                const: WORK_ORDER
          then:
            properties:
              businessOwnerType:
                const: WORK_ORDER
              businessOwnerId:
                type: string
                format: uuid
        - if:
            properties:
              purpose:
                const: REPORT_CREATION
          then:
            oneOf:
              - properties:
                  businessOwnerType:
                    const: REPORT
                  businessOwnerId:
                    type: string
                    format: uuid
              - properties:
                  businessOwnerType:
                    type: 'null'
                  businessOwnerId:
                    type: 'null'
