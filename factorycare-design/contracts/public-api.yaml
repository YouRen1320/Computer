          format: uuid
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    KnowledgeVersionLockRequest:
      type: object
      additionalProperties: false
      required: [lockVersion]
      properties:
        lockVersion:
          type: integer
          minimum: 0
    KnowledgeReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason, lockVersion]
      properties:
        decision:
          type: string
          enum: [APPROVE, REQUEST_CHANGES, REJECT]
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        lockVersion:
          type: integer
          minimum: 0
    KnowledgeReview:
      type: object
      additionalProperties: false
      required: [id, versionId, reviewerMembershipId, decision, reason, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        reviewerMembershipId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPROVE, REQUEST_CHANGES, REJECT]
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    PublishKnowledgeVersionRequest:
      type: object
      additionalProperties: false
      required: [reviewId, lockVersion]
      properties:
        reviewId:
          type: string
          format: uuid
        lockVersion:
          type: integer
          minimum: 0
    RevokeKnowledgeVersionRequest:
      type: object
      additionalProperties: false
      required: [reason, lockVersion]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        lockVersion:
          type: integer
          minimum: 0
    KnowledgeVersion:
      type: object
      additionalProperties: false
      required: [id, documentId, version, lockVersion, sha256, size, mime, publicationStatus, scanStatus]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Immutable content version number.
        lockVersion:
          type: integer
          minimum: 0
          description: Optimistic concurrency token for review, publication, and revocation commands.
        sha256:
          type: string
        size:
          type: integer
        mime:
          type: string
        publicationStatus:
          type: string
          enum: [DRAFT, IN_REVIEW, PUBLISHED, REVOKED]
        scanStatus:
          type: string
          enum: [PENDING, CLEAN, QUARANTINED, FAILED]
    DownloadIntent:
      type: object
      required: [downloadUrl, expiresAt]
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    RequestTriageSuggestionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
        additionalFacts:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 1000
    PublicModelMetadata:
      type: object
      additionalProperties: false
      required: [model, promptVersion, startedAt, latencyMs]
      properties:
        model:
          type: string
          maxLength: 200
        promptVersion:
          type: string
          maxLength: 100
        indexVersion:
          type: [string, 'null']
          maxLength: 100
        startedAt:
          type: string
          format: date-time
        latencyMs:
          type: integer
          minimum: 0
    PublicTriageSuggestion:
      type: object
      additionalProperties: false
      required: [suggestionId, modelCallId, category, priority, possibleFaultCodes, confidence, evidenceSummary, missingInformationQuestions, metadata]
      properties:
        suggestionId:
          type: string
          format: uuid
        modelCallId:
          type: string
          format: uuid
        category:
          type: string
          maxLength: 100
        priority:
          $ref: '#/components/schemas/Priority'
        possibleFaultCodes:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidenceSummary:
          type: string
          maxLength: 3000
        missingInformationQuestions:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 1000
        metadata:
          $ref: '#/components/schemas/PublicModelMetadata'
    PublicAnswerRequest:
      type: object
      additionalProperties: false
      required: [question, maxCitations]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
        maxCitations:
          type: integer
          minimum: 1
          maximum: 10
    PublicAnswerStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/PublicAnswerStartEvent'
        - $ref: '#/components/schemas/PublicAnswerTextEvent'
        - $ref: '#/components/schemas/PublicAnswerCitationEvent'
        - $ref: '#/components/schemas/PublicAnswerNoAnswerEvent'
        - $ref: '#/components/schemas/PublicAnswerErrorEvent'
        - $ref: '#/components/schemas/PublicAnswerEndEvent'
      discriminator:
        propertyName: event
    PublicAnswerStartEvent:
      type: object
      additionalProperties: false
      required: [event, answerId, traceId]
      properties:
        event:
          const: start
        answerId:
          type: string
          format: uuid
        traceId:
          type: string
          minLength: 16
          maxLength: 64
    PublicAnswerTextEvent:
      type: object
      additionalProperties: false
      required: [event, sequence, delta]
      properties:
        event:
          const: text
        sequence:
          type: integer
          minimum: 0
        delta:
          type: string
          maxLength: 4000
    PublicAnswerCitationEvent:
      type: object
      additionalProperties: false
      required: [event, citationId, sourceVersionId, title, locator]
      properties:
        event:
          const: citation
        citationId:
          type: string
          format: uuid
        sourceVersionId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        locator:
          type: string
          maxLength: 500
    PublicAnswerNoAnswerEvent:
      type: object
      additionalProperties: false
      required: [event, reason, followUpQuestions]
      properties:
        event:
          const: no_answer
        reason:
          type: string
          maxLength: 2000
        followUpQuestions:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 1000
    PublicAnswerErrorEvent:
      type: object
      additionalProperties: false
      required: [event, code, message, retryable]
      properties:
        event:
          const: error
        code:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 1000
        retryable:
          type: boolean
    PublicAnswerEndEvent:
      type: object
      additionalProperties: false
      required: [event, citationIds, metadata]
      properties:
        event:
          const: end
        citationIds:
          type: array
          uniqueItems: true
          maxItems: 10
          items:
            type: string
            format: uuid
        metadata:
          $ref: '#/components/schemas/PublicModelMetadata'
    PublicEvaluationRequest:
      type: object
      additionalProperties: false
      required: [datasetId, modelAlias, promptVersion, indexVersion, maxCases]
      properties:
        datasetId:
          type: string
          format: uuid
        modelAlias:
          type: string
          minLength: 1
          maxLength: 200
        promptVersion:
          type: string
          minLength: 1
          maxLength: 100
        indexVersion:
          type: string
          minLength: 1
          maxLength: 100
        maxCases:
          type: integer
          minimum: 1
          maximum: 500
    EvaluationRunSummary:
      type: object
      additionalProperties: false
      required: [runId, status, datasetId, caseCount]
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]
        datasetId:
          type: string
          format: uuid
        caseCount:
          type: integer
          minimum: 0
        completedCount:
          type: integer
          minimum: 0
        metrics:
          type: object
          additionalProperties:
            type: number
        hardFailureCodes:
          type: array
          uniqueItems: true
          items:
            type: string
    AuditLogEntry:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actorDisplay, action, objectType, objectId, traceId]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorDisplay:
          type: string
        action:
          type: string
        objectType:
          type: string
        objectId:
          type: string
          format: uuid
        beforeSummary:
          type: [string, 'null']
        afterSummary:
          type: [string, 'null']
        traceId:
          type: string
    AuditLogPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    AuditExportRequest:
      type: object
      additionalProperties: false
      required: [from, to, reason, format]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        format:
          type: string
          enum: [CSV, JSON]
    AuditExportJob:
      type: object
      additionalProperties: false
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        download:
          oneOf:
            - $ref: '#/components/schemas/DownloadIntent'
            - type: 'null'
    OperationsSummary:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - totalWorkOrders
        - overdueWorkOrders
        - firstTimeResolved
        - firstTimeResolutionRate
        - repeatFailures
        - repeatFailureRate
        - knowledgeQueries
        - knowledgeHits
        - knowledgeHitRate
        - aiSuggestionsReviewed
        - aiSuggestionsAdopted
        - aiSuggestionAdoptionRate
        - byStatus
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalWorkOrders:
          type: integer
          minimum: 0
        overdueWorkOrders:
          type: integer
          minimum: 0
        firstTimeResolved:
          type: integer
          minimum: 0
        firstTimeResolutionRate:
          type: number
          minimum: 0
          maximum: 1
        repeatFailures:
          type: integer
          minimum: 0
        repeatFailureRate:
          type: number
          minimum: 0
          maximum: 1
        knowledgeQueries:
          type: integer
          minimum: 0
        knowledgeHits:
          type: integer
          minimum: 0
        knowledgeHitRate:
          type: number
          minimum: 0
          maximum: 1
        aiSuggestionsReviewed:
          type: integer
          minimum: 0
        aiSuggestionsAdopted:
          type: integer
          minimum: 0
        aiSuggestionAdoptionRate:
          type: number
          minimum: 0
          maximum: 1
        byStatus:
          type: object
          propertyNames:
            enum: [CREATED, TRIAGED, ASSIGNED, ACCEPTED, IN_PROGRESS, PENDING_PARTS, PENDING_APPROVAL, RESOLVED, VERIFIED, CLOSED, REOPENED, CANCELLED]
          additionalProperties:
            type: integer
            minimum: 0
    SlaSummary:
      type: object
      required: [from, to, total, overdue, unaccepted, byStatus]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        total:
          type: integer
        overdue:
          type: integer
        unaccepted:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      required: [type, title, status, code, message, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
security:
  - browserSession: []
    csrfHeader: []
  - mobileBearer: []
