openapi: 3.1.0
info:
  title: FactoryCare Public API Design Baseline
  version: 0.1.0-design
  description: >-
    Java-owned public contract for Vue, Nuxt, uni-app, and Flutter. This is a
    design baseline, not proof of implementation. All tenant and actor context
    comes from authenticated server-side context.
servers:
  - url: https://factorycare.example.test
    description: Placeholder only; no public deployment is claimed.
tags:
  - name: Auth
  - name: Organizations
  - name: Teams
  - name: Assets
  - name: Reports
  - name: WorkOrders
  - name: Attachments
  - name: Knowledge
  - name: Reporting
  - name: Audit
  - name: AI
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginWithSession
      summary: Create a browser session for a controlled local identity provider.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session created; secure cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
            X-CSRF-Token:
              description: Initial browser CSRF token; refresh through /api/v1/auth/csrf-token.
              schema:
                type: string
                minLength: 32
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutCurrentSession
      responses:
        '204':
          description: Session invalidated.
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentActor
      security:
        - browserSession: []
        - mobileBearer: []
      responses:
        '200':
          description: Current trusted actor context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActor'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
  /api/v1/auth/csrf-token:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Issue or refresh a CSRF token for an authenticated browser session.
      security:
        - browserSession: []
      responses:
        '200':
          description: Token that must be sent as X-CSRF-Token on browser state changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'

  /api/v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      security:
        - browserSession: []
        - mobileBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Organizations inside the current actor data scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
    post:
      tags: [Organizations]
      operationId: createOrganization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created in the trusted tenant context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated with optimistic version checking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/memberships:
    get:
      tags: [Organizations]
      operationId: listMemberships
      security:
        - browserSession: []
        - mobileBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: organizationId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memberships inside the trusted actor data scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
    post:
      tags: [Organizations]
      operationId: inviteMembership
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMembershipRequest'
      responses:
        '201':
          description: Membership invitation or mapping created without granting a role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    patch:
      tags: [Organizations]
      operationId: updateMembership
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest'
      responses:
        '200':
          description: Membership organization, scope, or enabled state updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/memberships/{membershipId}/role-assignments:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [Organizations]
      operationId: assignMembershipRole
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignMembershipRoleRequest'
      responses:
        '204':
          description: Role assigned after tenant and privilege-escalation checks.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/memberships/{membershipId}/role-assignments/{roleId}/revocations:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
      - $ref: '#/components/parameters/RoleId'
    post:
      tags: [Organizations]
      operationId: revokeMembershipRole
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: Role revoked and authorization caches invalidated.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/roles:
    get:
      tags: [Organizations]
      operationId: listRoles
      summary: List the fixed role catalog available for explicit assignment.
      security:
        - browserSession: []
        - mobileBearer: []
      responses:
        '200':
          description: Stable role catalog; roles are not tenant-created resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'

  /api/v1/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      security:
        - browserSession: []
        - mobileBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: organizationId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Teams inside the current actor data scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
    post:
      tags: [Teams]
      operationId: createTeam
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created inside the trusted tenant and organization context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      operationId: getTeam
      security:
        - browserSession: []
        - mobileBearer: []
      responses:
        '200':
          description: Authorized team detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Teams]
      operationId: updateTeam
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Team updated with optimistic version checking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/equipment-models:
    get:
      tags: [Assets]
      operationId: listEquipmentModels
      security:
        - browserSession: []
        - mobileBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tenant-scoped equipment model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentModelPage'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
    post:
      tags: [Assets]
      operationId: createEquipmentModel
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentModelRequest'
      responses:
        '201':
          description: Equipment model created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentModel'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/equipment-models/{equipmentModelId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentModelId'
    get:
      tags: [Assets]
      operationId: getEquipmentModel
      security:
        - browserSession: []
        - mobileBearer: []
      responses:
        '200':
          description: Authorized equipment model detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentModel'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Assets]
      operationId: updateEquipmentModel
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentModelRequest'
      responses:
        '200':
          description: Equipment model updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentModel'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/locations:
    get:
      tags: [Assets]
      operationId: listLocations
      security:
        - browserSession: []
        - mobileBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tenant-scoped location catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPage'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
    post:
      tags: [Assets]
      operationId: createLocation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Location created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    get:
      tags: [Assets]
      operationId: getLocation
      security:
        - browserSession: []
        - mobileBearer: []
      responses:
        '200':
          description: Authorized location detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Assets]
      operationId: updateLocation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Location updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/assets:
    get:
      tags: [Assets]
      operationId: listAssets
      security:
        - browserSession: []
        - mobileBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssetStatus'
      responses:
        '200':
          description: Tenant-scoped asset page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
    post:
      tags: [Assets]
      operationId: createAsset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: Asset created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAsset
      security:
        - browserSession: []
        - mobileBearer: []
      responses:
        '200':
          description: Authorized asset detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Assets]
      operationId: updateAsset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
      responses:
        '200':
          description: Updated asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/assets/{assetId}/code-rotations:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [Assets]
      operationId: rotateAssetPublicCode
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateAssetCodeRequest'
      responses:
        '201':
          description: New opaque code returned once; the previous code is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCodeIssue'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /api/v1/asset-codes:resolve:
    post:
      tags: [Assets]
      operationId: resolveAssetPublicCode
      summary: Resolve an opaque QR value from the request body without placing it in access-log URLs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAssetCodeRequest'
      responses:
        '200':
          description: Anonymous minimal asset identity needed to start a report; no operational status or protected detail is disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousResolvableAsset'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '410':
          description: Code expired or revoked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'

  /api/v1/reports:
    post:
      tags: [Reports]
      operationId: createReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Report and initial work order created exactly once for this request key.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/IdempotencyConflictProblem'
  /api/v1/reports/mine:
    get:
      tags: [Reports]
      operationId: listMyReports
      security:
        - browserSession: []
        - mobileBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Reports visible to the current reporter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
  /api/v1/reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Reports]
      operationId: getReport
      security:
        - browserSession: []
        - mobileBearer: []
      responses:
        '200':
          description: Authorized report detail and public work-order progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /api/v1/reports/{reportId}/supplements:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    post:
      tags: [Reports]
      operationId: addReportSupplement
