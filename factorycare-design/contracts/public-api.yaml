components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: FACTORYCARE_SESSION
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-OIDC-access-token
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Required together with browserSession. Native and mobile bearer clients
        use mobileBearer instead and do not send this browser CSRF credential.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EquipmentModelId:
      name: equipmentModelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationRunId:
      name: evaluationRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditExportId:
      name: auditExportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    WorkOrderCommandSuccess:
      description: Command accepted and current aggregate returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkOrderDetail'
    ValidationProblem:
      description: Request syntax or field validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationProblem:
      description: Authentication is missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthorizationProblem:
      description: Actor lacks permission or data scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: Resource is absent or intentionally hidden from this actor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictProblem:
      description: State, version, uniqueness, or business-rule conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflictProblem:
      description: The same idempotency key was reused with a different request fingerprint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitProblem:
      description: Request quota or enumeration protection rejected the request.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyProblem:
      description: A bounded dependency is unavailable; the core manual workflow remains available.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        headerName:
          const: X-CSRF-Token
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    OrganizationStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, status, version]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        version:
          type: integer
          minimum: 0
    OrganizationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        version:
          type: integer
          minimum: 0
    TeamStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    Team:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, status, version]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TeamStatus'
        version:
          type: integer
          minimum: 0
    TeamPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [organizationId, name]
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TeamStatus'
        version:
          type: integer
          minimum: 0
    Role:
      type: object
      additionalProperties: false
      required: [id, code, displayName]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Stable fixed-catalog code used by authorization policy.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
    MembershipStatus:
      type: string
      enum: [INVITED, ACTIVE, DISABLED]
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [id, userId, organizationId, teamId, displayName, status, dataScope, roleCodes, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        teamId:
          type: [string, 'null']
          format: uuid
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/MembershipStatus'
        dataScope:
          type: string
          enum: [SELF, TEAM, ORGANIZATION, TENANT]
        roleCodes:
          type: array
          uniqueItems: true
          items:
            type: string
        version:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              dataScope:
                const: TEAM
          then:
            properties:
              teamId:
                type: string
                format: uuid
          else:
            properties:
              teamId:
                type: 'null'
    MembershipPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    InviteMembershipRequest:
      type: object
      additionalProperties: false
      required: [oidcSubjectHint, organizationId, teamId, displayName, dataScope]
      properties:
        oidcSubjectHint:
          type: string
          minLength: 1
          maxLength: 300
          description: Provider-scoped mapping hint; never treated as an authenticated subject by itself.
        organizationId:
          type: string
          format: uuid
        teamId:
          type: [string, 'null']
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        dataScope:
          type: string
          enum: [SELF, TEAM, ORGANIZATION, TENANT]
      allOf:
        - if:
            properties:
              dataScope:
                const: TEAM
          then:
            properties:
              teamId:
                type: string
                format: uuid
          else:
            properties:
              teamId:
                type: 'null'
    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        organizationId:
          type: string
          format: uuid
        teamId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/MembershipStatus'
        dataScope:
          type: string
          enum: [SELF, TEAM, ORGANIZATION, TENANT]
        version:
          type: integer
          minimum: 0
      allOf:
        - if:
            required: [dataScope]
            properties:
              dataScope:
                const: TEAM
          then:
            required: [teamId]
            properties:
              teamId:
                type: string
                format: uuid
        - if:
            required: [dataScope]
            properties:
              dataScope:
                enum: [SELF, ORGANIZATION, TENANT]
          then:
            properties:
              teamId:
                type: 'null'
    AssignMembershipRoleRequest:
      type: object
      additionalProperties: false
      required: [roleId, membershipVersion, reason]
      properties:
        roleId:
          type: string
          format: uuid
        membershipVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 256
    CurrentActor:
      type: object
      additionalProperties: false
      required: [userId, tenantId, membershipId, displayName, permissions, dataScope]
      properties:
        userId:
          type: string
