<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>媒体资源练习｜FactoryCare</title>
  </head>
  <body>
    <!-- Responsibility: 声明修复后的图片候选、视频、字幕和外部文字稿。 -->
    <!-- Data source: media-exercise-solution 固定虚构 URL，不含真实 FactoryCare 附件。 -->
    <!-- Mapping: 候选表达同一油迹事实，track 与 transcript 对应同一片段。 -->
    <!-- Side effects: 浏览器可请求媒体 URL；离线验证本身不发网络请求。 -->
    <main>
      <h1>媒体资源练习</h1>
      <picture>
        <source type="image/webp"
                srcset="./incident-small.webp 480w, ./incident-large.webp 960w"
                sizes="(max-width: 40rem) 100vw, 40rem">
        <img id="incident" src="./incident.jpg"
             srcset="./incident-small.jpg 480w, ./incident-large.jpg 960w"
             sizes="(max-width: 40rem) 100vw, 40rem"
             width="960" height="640"
             alt="泵体接口下方有深色油迹">
      </picture>
      <img id="separator" src="./separator.svg" alt="">
      <video controls preload="metadata" poster="./poster.jpg">
        <source src="./inspection.webm" type="video/webm">
        <source src="./inspection.mp4" type="video/mp4">
        <track kind="captions" src="./captions.vtt" srclang="zh-CN" label="简体中文字幕" default>
        <p>浏览器不支持 video 元素。</p>
      </video>
      <p><a href="./transcript.html">阅读检修视频文字稿</a></p>
    </main>
  </body>
</html>
