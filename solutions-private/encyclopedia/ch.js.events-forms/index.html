<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>Events and forms solution</title></head>
  <body>
    <!-- Script delegates from this stable owner instead of attaching per-row listeners. -->
    <ul id="work-orders">
      <li><button type="button" data-action="assign" data-work-order-id="WO-2"><span id="target">接单</span></button></li>
    </ul>
    <!-- The form remains natively labeled and submittable when enhancement is absent. -->
    <form id="filter" action="/work-orders" method="get">
      <label for="status">状态</label>
      <select id="status" name="status"><option value="ASSIGNED" selected>处理中</option></select>
      <input type="checkbox" name="urgent" value="true" checked>
      <button type="submit">筛选</button>
    </form>
  </body>
</html>
