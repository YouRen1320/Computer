schema_version: 1
toolchain_id: p9-publication-accessibility
scope: macos-arm64-local-observation
observed_on: '2026-07-24'
evidence_classification: machine-only-not-certification
promotion_policy: forbidden-without-human-review
network_policy: forbidden-by-contract-not-os-enforced
contract:
  artifact_count: 307
  artifacts_by_format:
    html: 273
    epub: 17
    pdf: 17
  check_count: 324
  checks_by_engine:
    axe-core: 273
    epubcheck: 17
    ace: 17
    verapdf: 17
  axe_rule_tags: [wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22a, wcag22aa]
  default_timeout_seconds: 600
  transient_tool_output_limit_bytes: 268435456
tools:
  - id: axe-core
    role: audit-engine
    resolver: env-directory
    environment_variable: FACTORYCARE_ACCESSIBILITY_NODE_BIN
    executable: axe
    version_arguments: [--version]
    expected_version_prefix: 4.12.1
    parser: axe-cli-json-v1
    formats: [html]
    checks_per_artifact: 1
    note: 只读取离线 HTML 候选并固定执行 WCAG 2.0/2.1/2.2 A/AA 标签；自动规则通过不能单独证明 WCAG 合规
  - id: epubcheck
    role: audit-engine
    resolver: path
    environment_variable: PATH
    executable: epubcheck
    version_arguments: [--version]
    expected_version_prefix: EPUBCheck v5.3.0
    parser: epubcheck-json-v5
    formats: [epub]
    checks_per_artifact: 1
    note: 警告也按机器失败处理；结构检查不能替代 EPUB Accessibility 人工评估
  - id: ace
    role: audit-engine
    resolver: env-directory
    environment_variable: FACTORYCARE_ACCESSIBILITY_NODE_BIN
    executable: ace
    version_arguments: [--version]
    expected_version_prefix: 1.4.6
    parser: ace-report-json-v1
    formats: [epub]
    checks_per_artifact: 1
    note: Ace 与 EPUBCheck 独立执行；两者通过仍不是辅助技术互操作证明
  - id: verapdf
    role: audit-engine
    resolver: path
    environment_variable: PATH
    executable: verapdf
    version_arguments: [--version]
    expected_version_prefix: veraPDF 1.30.0
    parser: verapdf-json-v1
    formats: [pdf]
    checks_per_artifact: 1
    note: 固定 PDF/UA-1 profile；机器合规结果不能替代完整人工 PDF/UA 评估
  - id: chrome
    role: runtime-dependency
    resolver: env-file
    environment_variable: FACTORYCARE_CHROME_EXECUTABLE
    executable: chrome
    version_arguments: [--version]
    expected_version_prefix: Google Chrome 150.0.7871.184
    parser: not-applicable
    formats: []
    checks_per_artifact: 0
    note: axe-core 的本机浏览器运行时；只记录入口与版本身份，不记录绝对位置
  - id: chromedriver
    role: runtime-dependency
    resolver: env-file
    environment_variable: FACTORYCARE_CHROMEDRIVER
    executable: chromedriver
    version_arguments: [--version]
    expected_version_prefix: ChromeDriver 150.0.7871.124
    parser: not-applicable
    formats: []
    checks_per_artifact: 0
    note: 必须与 Chrome 主版本匹配；报告只保留脱敏身份摘要
