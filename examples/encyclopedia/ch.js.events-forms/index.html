<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>FactoryCare event delegation example</title>
  </head>
  <body>
    <!-- The list is the stable delegation root; work-order rows may be inserted later. -->
    <main>
      <h1>工单交互</h1>
      <ul id="work-orders">
        <li data-work-order-id="WO-1">
          <button type="button" data-action="assign" data-work-order-id="WO-1"><span>接单 WO-1</span></button>
        </li>
      </ul>

      <!-- Native action, method, labels, names, and constraints remain valid without JavaScript. -->
      <form id="work-order-filter" action="/work-orders" method="get">
        <label for="status">工单状态</label>
        <select id="status" name="status" required>
          <option value="CREATED">待分派</option>
          <option value="ASSIGNED" selected>处理中</option>
        </select>
        <label><input type="checkbox" name="urgent" value="true" checked>仅看紧急</label>
        <button type="submit">筛选</button>
      </form>
    </main>
  </body>
</html>
